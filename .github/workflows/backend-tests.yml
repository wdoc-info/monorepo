name: backend.wdoc.info - Tests

on:
  push:
    branches:
      - '**'
    paths:
      - backend.wdoc.info/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend.wdoc.info/**
      - .github/workflows/backend-tests.yml
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend.wdoc.info

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
