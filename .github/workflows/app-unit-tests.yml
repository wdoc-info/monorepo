name: app.wdoc.info - Unit Tests

on:
  push:
    branches:
      - '**'
    paths:
      - app.wdoc.info/**
      - .github/workflows/app-unit-tests.yml
  pull_request:
    paths:
      - app.wdoc.info/**
      - .github/workflows/app-unit-tests.yml
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app.wdoc.info

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app.wdoc.info/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          CI: true
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --progress=false --code-coverage
